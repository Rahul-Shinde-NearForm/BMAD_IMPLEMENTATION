<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pharmacy Workbench</title>
    <link rel="stylesheet" href="/static/css/app.css" />
</head>

<body>
    <main class="container">
        <h1>Pharmacy Workbench</h1>
        <p>Pharmacy console for patient lookup and prescription retrieval/print.</p>

        <section class="toolbar">
            <a class="btn-link" href="/">Back to Home</a>
        </section>

        <section>
            <h2>1. Search Patient</h2>
            <form id="pharmaSearchForm" class="form-grid">
                <label>Mobile <input type="text" name="phone" /></label>
                <label>Name <input type="text" name="name" /></label>
                <label>DOB <input type="date" name="dob" /></label>
                <label>MRN (optional) <input type="text" name="mrn" /></label>
                <div><button type="submit">Search</button></div>
            </form>
            <pre id="pharmaSearchResult" class="result-box"></pre>
        </section>

        <section>
            <h2>2. Prescription and Orders by Consultation ID</h2>
            <form id="prescriptionGetForm" class="form-inline">
                <label>Consultation ID <input type="number" name="consultation_id" min="1" required /></label>
                <button type="submit">Get Prescription</button>
                <button type="button" id="ordersBtn">Get Orders</button>
                <button type="button" id="printRxBtn">Open Printable Rx</button>
            </form>
            <pre id="prescriptionGetResult" class="result-box"></pre>
            <pre id="ordersResult" class="result-box"></pre>
        </section>

        <script>
            async function doGet(url, targetId) {
                const res = await fetch(url, { credentials: "same-origin" });
                const text = await res.text();
                document.getElementById(targetId).textContent = text;
            }

            document.getElementById("pharmaSearchForm").addEventListener("submit", (e) => {
                e.preventDefault();
                const params = new URLSearchParams(new FormData(e.target));
                doGet(`/api/patients/search/?${params.toString()}`, "pharmaSearchResult");
            });

            document.getElementById("prescriptionGetForm").addEventListener("submit", (e) => {
                e.preventDefault();
                const consultationId = new FormData(e.target).get("consultation_id");
                doGet(`/api/consultations/${consultationId}/prescription/get/`, "prescriptionGetResult");
            });

            document.getElementById("ordersBtn").addEventListener("click", () => {
                const consultationId = new FormData(document.getElementById("prescriptionGetForm")).get("consultation_id");
                if (!consultationId) return;
                doGet(`/api/consultations/${consultationId}/orders/list/`, "ordersResult");
            });

            document.getElementById("printRxBtn").addEventListener("click", () => {
                const consultationId = new FormData(document.getElementById("prescriptionGetForm")).get("consultation_id");
                if (!consultationId) return;
                window.open(`/consultations/${consultationId}/prescription/print/`, "_blank");
            });
        </script>
    </main>
</body>

</html>
