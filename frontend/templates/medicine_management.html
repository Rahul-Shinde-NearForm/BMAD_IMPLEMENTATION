<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medicine Management — Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            background: #1a4d6d;
            color: #fff;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.8rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1a88cc;
            color: #fff;
        }

        .btn-primary:hover {
            background: #155aa8;
        }

        .btn-secondary {
            background: #6c757d;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-sm {
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: #fff;
        }

        .btn-success:hover {
            background: #218838;
        }

        .section {
            background: #fff;
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #1a4d6d;
            border-bottom: 2px solid #dce8ff;
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #c6d7fa;
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1a88cc;
            box-shadow: 0 0 0 3px rgba(26, 136, 204, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 1rem;
            align-items: flex-end;
        }

        @media (max-width: 900px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="checkbox"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead {
            background: #dce8ff;
            font-weight: 600;
            color: #1a4d6d;
        }

        th,
        td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid #e0e8f5;
        }

        tbody tr:hover {
            background: #f8fafd;
        }

        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.7rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-active {
            background: #d1f2d1;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .result-box {
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 4px;
            border: 1px solid #c6d7fa;
        }

        .result-success {
            background: #d1f2d1;
            color: #155724;
            border-color: #c3e6cb;
        }

        .result-error {
            background: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 1rem;
            color: #666;
        }

        .loading.show {
            display: block;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #1a88cc;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>

        <header>
            <h1>💊 Medicine Management</h1>
            <button type="button" class="btn btn-primary" onclick="scrollToForm()">+ Add New Medicine</button>
        </header>

        <div class="section">
            <h2>Add or Update Medicine</h2>
            <form id="medicineForm" onsubmit="handleAddMedicine(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="medicineName">Medicine Name *</label>
                        <input type="text" id="medicineName" name="name" placeholder="e.g., Paracetamol" required />
                    </div>
                    <div class="form-group">
                        <label for="medicineCategory">Category *</label>
                        <select id="medicineCategory" name="category" required>
                            <option value="analgesic">Analgesic / Pain Relief</option>
                            <option value="antibiotic">Antibiotic</option>
                            <option value="antifungal">Antifungal</option>
                            <option value="antiseptic">Antiseptic / Mouthwash</option>
                            <option value="anti_inflammatory">Anti-inflammatory</option>
                            <option value="antacid">Antacid / GI</option>
                            <option value="antihistamine">Antihistamine</option>
                            <option value="antihypertensive">Antihypertensive</option>
                            <option value="antidiabetic">Antidiabetic</option>
                            <option value="vitamin">Vitamin / Supplement</option>
                            <option value="dental">Dental Specific</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="medicineStrength">Default Strength</label>
                        <input type="text" id="medicineStrength" name="default_strength" placeholder="e.g., 500mg" />
                    </div>
                    <div class="form-group">
                        <label class="checkbox-group">
                            <input type="checkbox" id="medicineActive" name="is_active" checked />
                            Active
                        </label>
                    </div>
                </div>
                <div style="display:flex; gap:0.75rem;">
                    <button type="submit" class="btn btn-success">Save Medicine</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>
                <div id="addMedicineResult"></div>
            </form>
        </div>

        <div class="section">
            <h2>All Medicines</h2>
            <div class="loading" id="tableLoading">Loading medicines...</div>
            <div class="table-container">
                <table id="medicineTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Default Strength</th>
                            <th>Status</th>
                            <th style="text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="medicineTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function getCSRFToken() {
            const match = document.cookie.match(/csrftoken=([^;]+)/);
            return match ? match[1] : "";
        }

        async function handleAddMedicine(event) {
            event.preventDefault();
            const form = event.target;
            const resultBox = document.getElementById("addMedicineResult");
            resultBox.className = "";
            resultBox.textContent = "";

            const formData = new FormData(form);
            try {
                const response = await fetch("/api/medicines/create/", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "X-CSRFToken": getCSRFToken() },
                    body: formData,
                });
                const data = await response.json();
                if (response.ok && data.status === "success") {
                    resultBox.className = "result-box result-success";
                    resultBox.textContent = `✓ ${data.data.name} saved successfully.`;
                    form.reset();
                    await loadMedicines();
                } else {
                    resultBox.className = "result-box result-error";
                    resultBox.textContent = "✗ Error: " + (data.error || "Unknown error");
                }
            } catch (e) {
                resultBox.className = "result-box result-error";
                resultBox.textContent = "✗ Error: " + e.message;
            }
        }

        async function loadMedicines() {
            const tbody = document.getElementById("medicineTableBody");
            const loading = document.getElementById("tableLoading");
            loading.classList.add("show");
            tbody.innerHTML = "";

            try {
                const response = await fetch("/api/medicines/list/", { credentials: "same-origin" });
                const data = await response.json();
                if (data.status === "success") {
                    const medicines = data.data || [];
                    if (!medicines.length) {
                        tbody.innerHTML =
                            '<tr><td colspan="5" style="text-align:center; color:#999;">No medicines found.</td></tr>';
                    } else {
                        medicines.forEach((medicine) => {
                            const row = document.createElement("tr");
                            row.id = `med-${medicine.id}`;
                            row.innerHTML = `
                                <td><strong>${medicine.name}</strong></td>
                                <td>${formatCategory(medicine.category)}</td>
                                <td>${medicine.default_strength || "-"}</td>
                                <td>
                                    <span class="status-badge ${medicine.is_active ? "status-active" : "status-inactive"}">
                                        ${medicine.is_active ? "Active" : "Inactive"}
                                    </span>
                                </td>
                                <td style="text-align:right;">
                                    <div class="actions">
                                        <button type="button" class="btn btn-sm btn-secondary"
                                            onclick="editMedicine(${medicine.id}, '${medicine.name}', '${medicine.category}', '${medicine.default_strength || ""}')">
                                            Edit
                                        </button>
                                        <button type="button" class="btn btn-sm ${medicine.is_active ? "btn-danger" : "btn-success"}"
                                            onclick="toggleActive(${medicine.id})">
                                            ${medicine.is_active ? "Deactivate" : "Activate"}
                                        </button>
                                    </div>
                                </td>
                            `;
                            tbody.appendChild(row);
                        });
                    }
                }
            } catch (e) {
                tbody.innerHTML =
                    `<tr><td colspan="5" style="text-align:center; color:red;">Error loading medicines: ${e.message}</td></tr>`;
            } finally {
                loading.classList.remove("show");
            }
        }

        function formatCategory(cat) {
            const categories = {
                analgesic: "Analgesic / Pain Relief",
                antibiotic: "Antibiotic",
                antifungal: "Antifungal",
                antiseptic: "Antiseptic / Mouthwash",
                anti_inflammatory: "Anti-inflammatory",
                antacid: "Antacid / GI",
                antihistamine: "Antihistamine",
                antihypertensive: "Antihypertensive",
                antidiabetic: "Antidiabetic",
                vitamin: "Vitamin / Supplement",
                dental: "Dental Specific",
                other: "Other",
            };
            return categories[cat] || cat;
        }

        function editMedicine(id, name, category, strength) {
            document.getElementById("medicineName").value = name;
            document.getElementById("medicineCategory").value = category;
            document.getElementById("medicineStrength").value = strength;
            document.getElementById("medicineActive").checked = true;
            scrollToForm();
        }

        async function toggleActive(medicineId) {
            if (!confirm("Toggle medicine active status?")) return;
            try {
                const response = await fetch(`/api/medicines/${medicineId}/toggle-active/`, {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "X-CSRFToken": getCSRFToken() },
                });
                const data = await response.json();
                if (response.ok) {
                    await loadMedicines();
                } else {
                    alert("Error: " + (data.error || "Unknown error"));
                }
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        function scrollToForm() {
            document.getElementById("medicineForm").scrollIntoView({ behavior: "smooth" });
            document.getElementById("medicineName").focus();
        }

        // Load medicines on page load
        document.addEventListener("DOMContentLoaded", loadMedicines);
    </script>
</body>

</html>
