<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - OPD Management System</title>
    <link rel="stylesheet" href="/static/css/app.css" />
</head>

<body>
    <main class="container">
        <h1>Login</h1>
        <p>Use your OPD credentials to access protected functionality.</p>

        {% if form.errors %}
        <p>Invalid username or password.</p>
        {% endif %}

        <form method="post" action="/login/">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>

</html>
