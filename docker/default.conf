# ============================================================================
# Nginx Server Configuration for OPD Frontend
# ============================================================================

upstream django_backend {
    # Point to Django backend service
    # In Docker Compose: service name is used as hostname
    # In Kubernetes: use service DNS
    server backend:8000 fail_timeout=0;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    charset utf-8;

    # ========================================================================
    # Static Files & Assets
    # ========================================================================
    
    location /static/ {
        alias /usr/share/nginx/html/static/;
        
        # Cache static assets for 1 year
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Enable gzip for static files
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
    }

    location /templates/ {
        alias /usr/share/nginx/html/templates/;
        expires 24h;
        add_header Cache-Control "public, max-age=86400";
    }

    # ========================================================================
    # Media Files (Uploads)
    # ========================================================================
    
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 24h;
        add_header Cache-Control "public, max-age=86400";
    }

    # ========================================================================
    # Health Check Endpoint
    # ========================================================================
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ========================================================================
    # API Proxy to Django Backend
    # ========================================================================
    
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Handle upgrades (for WebSocket if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========================================================================
    # Root and Directory Handling
    # ========================================================================
    
    location / {
        # Serve static files if they exist
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        # For SPA or template-based routing, point to index
        # Modify based on your application's routing requirements
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================================
    # Security - Deny access to sensitive files
    # ========================================================================
    
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.ht {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========================================================================
    # Error Pages
    # ========================================================================
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

